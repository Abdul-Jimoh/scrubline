# Runs the factory's checks (`npm run check`: typecheck and every test) on each pull request to main and each push
# to main, on every Node.js version package.json claims. Branch protection on main requires it before a merge.
# Read-only, no secrets, no model API: free on a public repository. Actions are pinned to full commit SHAs.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The lowest version package.json claims (the locked Vitest needs 22.12), then the current LTS lines.
        node: ['22.12', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
